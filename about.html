<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бидний тухай - Гэрэлт Булан</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           ҮНДСЭН ӨНГӨ БОЛОН ФОНТЫН ТОХИРГОО
           ========================================= */
        :root {
            --bg-color: #FDFBF7; /* Цайвар шаргал дэвсгэрт */
            --text-main: #2c2c2c; /* Үндсэн хар саарал текст */
            --text-muted: #4a4a4a; /* Дэд текст */
            --accent: #8b7355;
            --border-color: #e2dcd0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Lora', serif;
            line-height: 1.6;
        }

        /* =========================================
           SCROLLBAR (ГҮЙЛГЭХ МӨР)
           ========================================= */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFBF7;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }

        /* =========================================
           ЦЭС БОЛОН ТОЛГОЙ ХЭСЭГ (HEADER)
           ========================================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            border-bottom: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
        }

        .logo {
            font-family: 'Lora', serif;
            font-size: 1.5rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-main);
        }

        .main-menu {
            display: flex;
            gap: 2rem;
        }
